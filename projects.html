<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Aman Kushwaha · All Projects</title>
  <meta name="description" content="Every project by Aman Kushwaha, an Android developer crafting fast, stable Kotlin apps with MVVM and Clean Architecture." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="projects-page">
  <!-- Scroll progress -->
  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

  <!-- Film grain -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Aurora background -->
  <div class="bg-aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="site-shell">
    <!-- ============ NAV ============ -->
    <header class="nav glass" id="nav">
      <a class="logo" href="index.html" id="nav-logo"></a>
      <a href="index.html" class="btn btn-ghost magnetic" id="back-home">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11 11L3 3m0 0h7M3 3v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>BACK TO HOME</span>
      </a>
    </header>

    <main>
      <!-- ============ ALL PROJECTS ============ -->
      <section class="section" id="projects">
        <div class="section-head" data-scroll>
          <span class="mono section-tag">ALL PROJECTS</span>
          <h2 class="section-title">THE FULL CATALOG<span class="grad-text">.</span></h2>
        </div>
        <div class="filter-bar" id="filter-bar" data-scroll></div>
        <div class="project-grid" id="project-grid"></div>
      </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="foot" id="foot">
      <span class="mono">&copy; 2026 Aman Kushwaha — All systems nominal</span>
      <div class="foot-links mono">
        <a href="index.html#about">About</a>
        <a href="index.html#skills">Skills</a>
        <a href="index.html#experience">Experience</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <button class="back-top" id="back-top" aria-label="Back to top">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 11l5-5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </footer>
  </div>

  <!-- ============ PROJECT DETAIL MODAL ============ -->
  <div class="project-modal" id="project-modal" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel glass">
      <div class="modal-header">
        <button class="modal-back" id="modal-back">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>BACK</span>
        </button>
        <span class="modal-category mono" id="modal-category"></span>
        <button class="modal-close-x" id="modal-close" aria-label="Close detail">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- GSAP -->
  <script src="data.js"></script>
  <script>
    window.__gsapFallback = function () {
      if (window.gsap) return;
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js";
      document.body.appendChild(s);
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" onerror="window.__gsapFallback && window.__gsapFallback()"></script>
  <script src="projects.js"></script>
</body>
</html>
